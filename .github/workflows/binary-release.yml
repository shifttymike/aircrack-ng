name: airodump-ng binary release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v1.7.0-tui.1)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: airodump-ng Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y autoconf automake build-essential ethtool \
            libnl-3-dev libnl-genl-3-dev libpcap-dev libpcre2-dev \
            libsqlite3-dev libssl-dev libtool pkg-config zlib1g-dev

      - name: Configure and build
        run: |
          autoreconf -fi
          ./configure --without-opt --with-experimental --disable-shared --enable-static
          make -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Package airodump-ng
        shell: bash
        run: |
          binary_dir=.
          if [ -x .libs/airodump-ng ]; then
            binary_dir=.libs
          fi
          max_glibc="$(readelf --version-info "$binary_dir/airodump-ng" \
            | sed -n 's/.*Name: \(GLIBC_[0-9.]*\).*/\1/p' \
            | sort -V \
            | tail -n 1)"
          if [ -n "$max_glibc" ] \
            && [ "$(printf '%s\nGLIBC_2.35\n' "$max_glibc" | sort -V | tail -n 1)" != "GLIBC_2.35" ]; then
            echo "airodump-ng requires $max_glibc; the release baseline is GLIBC_2.35" >&2
            exit 1
          fi
          tar -C "$binary_dir" -czf airodump-ng-linux-${{ matrix.arch }}.tar.gz airodump-ng

      - uses: actions/upload-artifact@v4
        with:
          name: airodump-ng-linux-${{ matrix.arch }}
          path: airodump-ng-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          append_body: false
          prerelease: ${{ inputs.prerelease || false }}
          files: release-assets/*.tar.gz
